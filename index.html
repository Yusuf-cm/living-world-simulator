<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living World Simulator</title><style>body{margin:0;background:#050b18;color:#e9f3ff;font:14px system-ui}canvas{display:block}aside{position:fixed;top:18px;left:18px;width:255px;background:#0b1728e8;border:1px solid #344963;border-radius:15px;padding:18px;box-shadow:0 12px 35px #0009}h2{margin:0 0 5px}small{color:#91a8c4}label{display:block;margin-top:15px}input{width:100%}button{background:#244f85;color:white;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}#info{position:fixed;right:18px;bottom:18px;background:#0b1728e8;padding:12px;border-radius:10px;max-width:280px}strong{color:#a6d7ff}</style></head><body><aside><h2>Living World</h2><small>Full spherical planet • Wild Deck terrain algorithms</small><p id="clock">Day 1 • 12:00</p><button id="pause">Pause</button><button id="reset">Reset</button><label>World seed <input id="seed" type="number" value="20261101"></label><button id="regen">Generate world</button><label>Time speed <span id="speedv">60</span>×<input id="speed" type="range" min="0" max="600" value="60"></label><label>Axial tilt <span id="tiltv">23.5</span>°<input id="tilt" type="range" min="0" max="45" step="0.5" value="23.5"></label><label>Climate warming <span id="warmv">0</span> °C<input id="warm" type="range" min="-5" max="10" step="0.5" value="0"></label><label>Storm activity <span id="stormv">50</span>%<input id="storm" type="range" min="0" max="100" value="50"></label><label>World map layer <select id="layer" style="width:100%;padding:8px;background:#172b42;color:#fff;border:1px solid #42607c;border-radius:8px"><option value="biomes">Biomes</option><option value="elevation">Elevation</option><option value="temperature">Temperature</option><option value="moisture">Moisture</option></select></label><label><input type="checkbox" id="ocean" checked style="width:auto"> Ocean surface</label><label><input type="checkbox" id="atmosphere" checked style="width:auto"> Atmosphere</label><label><input type="checkbox" id="clouds" checked style="width:auto"> Clouds and weather</label><p><small>Drag to orbit • Scroll to zoom • Click the planet to inspect biomes and elevation.</small></p></aside><div id="info">Click the globe to inspect a location.</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module" src="./globe.js"></script></body></html>
